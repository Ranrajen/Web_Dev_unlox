<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>Document</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      gap: 50px;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    .topDiv {
      border: 2ox solid black;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 30px;
      background-color: white;
      border-radius: 12px;
    }
    .topDiv h1 {
      align-items: center;
    }
    button {
      background-color: aqua;
      width: 250px;
      padding: 20px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background-color: rgb(0, 220, 220);
    }
    .parent {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
  </style>
  <body>
    <!-- https://randomuser.me/api -->
    <div class="parent">
      <div class="topDiv">
        <h1>
          Displaying the API Fetching Task By the api stored in the varible
        </h1>
        <button onclick="getData()">Genrate random data</button>
      </div>
      <div id="result" class="topDiv"></div>
    </div>

    <script>
      let result = document.getElementById('result');

      function getData() {
        // result.innerText = 'Loading';
        fetch('https://randomuser.me/api')
          //succesfull

          .then((ress) => ress.json())
          // console.log()
          .then((data) => {
            console.log(data.results[0]);
            let info = data.results[0];
            console.log('The data is ', info);
            let randomPerson = info.gender;
            console.log(randomPerson);

            result.innerHTML += `
               <p>Name = ${info.name.first} ${info.name.last}</p>
               <p>gender  = ${info.gender}</p>
               <p>Email  = ${info.email}</p>`;
          });
      }
    </script>
  </body>
</html>
