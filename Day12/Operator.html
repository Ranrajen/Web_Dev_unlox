<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body>
    <script>
      // 1 . Arithamic Operator -- + , - , * , / , %
      var a = 10;
      var b = 3;
      console.log(a + b);
      console.log(a - b);
      console.log(a * b);
      console.log(a / b);

      // modulas -- remainder
      console.log(a % b);
      console.log(10 % 2);

      //   problem --- lhs < rhs  ans is --  2
      console.log(2 % 9);
      console.log(1 % 5);

      // 2.  Assignment Operator -- =
      a = 80;
      b = a;
      c = 'Hi';

      console.log((a = a + 20)); // add 20 in 80
      console.log((a += 3)); // add 3 in 100

      //   console.log(11 / 5);

      // 3. Camparision Operator

      var num1 = 25;
      var num2 = 20;
      var num3 = 20;
      console.log(num1 > num2);
      console.log(num1 > num2);
      console.log(num1 < num2);
      console.log(num1 == num2);
      console.log(num1 >= num3);
      console.log(num1 <= num3);
      console.log(num2 <= num3);

      //   ====== problem ====
      var x = '25';
      var y = 25;
      // == check the value
      // loose check
      console.log(x == y);
      // ===  check the value and the type
      // strict check
      console.log(x === y);

      // 3 . Logical Operator
      // used to operfomed the logical expression
      // And --&& --- Both True
      //OR --|| ---any one true \
      //NOT --! -- reverse the condition

      // AND ---
      var isMemb = true;
      var TotalPrice1 = 100;
      var c3 = isMemb && TotalPrice1;
      console.log('Checking the condition');
      console.log(isMemb && TotalPrice1 > 500);
      console.log(isMemb && TotalPrice1);
      console.log(c3); /// check here problem -- give the    number

      //OR
      var isActive = true;
      var isOnline = false;
      console.log(isActive || isOnline);
    </script>
