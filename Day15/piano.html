<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano</title>
    <style>
      .parent {
        border: 1px solid black;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .key {
        border: 1px solid red;
        height: 150px;
        margin: 5px;
        width: 25px;
        box-shadow: 2px 2px 3px rgb(185, 108, 108);
        transition: 0.3s;
        cursor: pointer;
      }

      .key:hover {
        transform: translateY(3px);
        /* transform: translateZ(-2px); */
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="key" data-note="a">a</div>
      <div class="key" data-note="b">b</div>
      <div class="key" data-note="c">c</div>
      <div class="key" data-note="d">d</div>
      <div class="key" data-note="e">e</div>
    </div>

    <audio id="audio-a" src="./11325622-piano-chords-239967.mp3"></audio>
    <audio
      id="audio-b"
      src="./farran_ez-minimal-piano-underscore-456148.mp3"
    ></audio>
    <audio
      id="audio-c"
      src="./royalty_free_music-soft-piano-100-bpm-121529.mp3"
    ></audio>
    <audio id="audio-d" src="./u_op8btczor7-piano-c-508248.mp3"></audio>
    <audio
      id="audio-e"
      src="./xgtg-nostalgia-a-sweet-amp-memorable-loopable-piano-song-by-gtg-319605.mp3"
    ></audio>

    <script>
      const keys = document.querySelectorAll('.key');
      console.log(keys);

      let currentAudio = null;

      keys.forEach(function (e) {
        const note = e.getAttribute('data-note');
        const audio = document.getElementById('audio-' + note);

        e.addEventListener('click', function () {
          if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
          }

          audio.currentTime = 0;
          audio.play();

          currentAudio = audio;
        });

        //mousse event

        e.addEventListener('mouseover', function () {
          e.style.backgroundColor = 'blue';
        });

        e.addEventListener('mouseout', function () {
          e.style.backgroundColor = 'red';
        });
      });
    </script>
  </body>
</html>
